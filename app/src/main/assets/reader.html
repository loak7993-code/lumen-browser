<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reader Mode</title>
<style>
:root {
  --bg: #fffef8;
  --text: #1a1a1a;
  --secondary: #666;
  --primary: #3b82f6;
  --divider: #e3e5e8;
  --font-size: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a1a;
    --text: #e8eaed;
    --secondary: #9aa0a6;
    --divider: #2c2f34;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  font-size: var(--font-size);
  line-height: 1.7;
  padding: 20px;
  max-width: 700px;
  margin: 0 auto;
  -webkit-text-size-adjust: 100%;
}
.reader-header {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--divider);
}
.reader-title {
  font-size: 1.6em;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 8px;
}
.reader-meta {
  font-size: 0.8em;
  color: var(--secondary);
}
.reader-content { }
.reader-content p { margin-bottom: 1.2em; }
.reader-content h1, .reader-content h2, .reader-content h3 {
  margin-top: 1.5em;
  margin-bottom: 0.7em;
  font-weight: 700;
}
.reader-content h2 { font-size: 1.3em; }
.reader-content h3 { font-size: 1.1em; }
.reader-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 1em 0; }
.reader-content a { color: var(--primary); }
.reader-content blockquote {
  border-left: 3px solid var(--primary);
  padding-left: 16px;
  margin: 1em 0;
  color: var(--secondary);
  font-style: italic;
}
.reader-content pre {
  background: var(--divider);
  padding: 12px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 0.85em;
  font-family: monospace;
}
.reader-content code { font-family: monospace; font-size: 0.85em; }
.reader-controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--divider);
  border-radius: 24px;
  padding: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
  z-index: 100;
}
.reader-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 20px;
  background: transparent;
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reader-btn:active { background: var(--divider); }
</style>
</head>
<body>
<div class="reader-header">
  <div class="reader-title" id="readerTitle"></div>
  <div class="reader-meta" id="readerMeta"></div>
</div>
<div class="reader-content" id="readerContent"></div>
<div class="reader-controls">
  <button class="reader-btn" onclick="window.LumenReader.adjustFont(-2)">A-</button>
  <button class="reader-btn" onclick="window.LumenReader.adjustFont(2)">A+</button>
  <button class="reader-btn" onclick="window.LumenReader.toggleTheme()">&#9789;</button>
  <button class="reader-btn" onclick="window.LumenReader.close()">&#10005</button>
</div>
</body>
</html>
