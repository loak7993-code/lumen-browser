[project]
name = "lumen-browser"
version = "1.0.0"
description = "Lumen - A lightweight private browser for Debian Bookworm"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
]

[project.scripts]
lumen = "lumen.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumen = ["assets/*", "resources/*"]
