<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lumen Search</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #f5f6f8;
  --text: #111418;
  --secondary: #5a6068;
  --primary: #3b82f6;
  --primary-dark: #1d4ed8;
  --divider: #e3e5e8;
  --radius: 16px;
  --secure: #16a34a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121316;
    --surface: #1e2024;
    --text: #e8eaed;
    --secondary: #9aa0a6;
    --divider: #2c2f34;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Roboto", "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.home {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  padding: 24px;
}
.home.hidden { display: none; }
.logo {
  width: 80px;
  height: 80px;
  border-radius: 22px;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 36px rgba(59,130,246,.35);
}
.logo svg { width: 46px; height: 46px; }
.brand {
  margin-top: 20px;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.brand span { color: var(--primary); }
.tagline {
  margin-top: 6px;
  font-size: 13px;
  color: var(--secondary);
}
.search-form { margin-top: 40px; width: 100%; max-width: 560px; }
.search-input-wrap { position: relative; }
.search-input {
  width: 100%;
  height: 56px;
  border: 1px solid var(--divider);
  border-radius: 28px;
  background: var(--surface);
  color: var(--text);
  padding: 0 56px 0 22px;
  font-size: 16px;
  outline: none;
  -webkit-appearance: none;
  transition: border-color .15s, box-shadow .15s;
}
.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}
.search-input::-webkit-search-cancel-button { display: none; }
.search-btn-icon {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  color: var(--secondary);
  pointer-events: none;
}
.suggestions {
  display: none;
  position: absolute;
  top: 62px;
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: 16px;
  z-index: 100;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
.suggestions.visible { display: block; }
.suggestion {
  padding: 12px 22px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.suggestion:active { background: var(--divider); }
.suggestion svg { width: 18px; height: 18px; color: var(--secondary); flex-shrink: 0; }
.protection-badge {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(22,163,74,.1);
  color: var(--secure);
  font-size: 12px;
  font-weight: 600;
}
.protection-badge svg { width: 14px; height: 14px; }
.footer {
  position: absolute;
  bottom: 24px;
  left: 0;
  right: 0;
  font-size: 11px;
  color: var(--secondary);
  text-align: center;
}
.results-page { display: none; }
.results-page.visible { display: block; }
.results-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding: 10px 12px 0;
  border-bottom: 1px solid var(--divider);
}
.search-row { display: flex; gap: 10px; align-items: center; }
.results-home {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.results-bar { flex: 1; position: relative; }
.results-input {
  width: 100%;
  height: 44px;
  border: 1px solid var(--divider);
  border-radius: 22px;
  background: var(--surface);
  color: var(--text);
  padding: 0 46px 0 18px;
  font-size: 15px;
  outline: none;
  -webkit-appearance: none;
}
.results-input:focus { border-color: var(--primary); }
.results-search-icon {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  color: var(--secondary);
}
.tabs {
  display: flex;
  gap: 4px;
  margin-top: 10px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 16px;
  border: none;
  background: none;
  color: var(--secondary);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}
.protection-mini {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 16px;
  background: rgba(22,163,74,.1);
  color: var(--secure);
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}
.results-body { padding: 12px 12px 80px; }
.results-meta {
  padding: 10px 4px 8px;
  font-size: 12px;
  color: var(--secondary);
}
.result-card {
  display: flex;
  gap: 12px;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 14px;
  background: var(--surface);
  text-decoration: none;
  color: var(--text);
  transition: background .12s;
}
.result-card:active { background: var(--divider); }
.result-favicon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--bg);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.result-favicon img {
  width: 24px;
  height: 24px;
  border-radius: 4px;
}
.result-favicon .fallback {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}
.result-content { flex: 1; min-width: 0; }
.result-url {
  font-size: 12px;
  color: var(--primary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.result-source {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--secondary);
  background: var(--bg);
  border: 1px solid var(--divider);
  border-radius: 8px;
  padding: 1px 6px;
  margin-left: auto;
  white-space: nowrap;
  flex-shrink: 0;
}
.result-title {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.35;
  margin-bottom: 4px;
}
.result-snippet {
  font-size: 13px;
  line-height: 1.5;
  color: var(--secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.image-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.image-item {
  aspect-ratio: 1;
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
}
.image-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.video-card {
  display: flex;
  flex-direction: column;
  margin-bottom: 12px;
  border-radius: 14px;
  background: var(--surface);
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
}
.video-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--divider);
  overflow: hidden;
  position: relative;
}
.video-thumb img { width: 100%; height: 100%; object-fit: cover; }
.video-play {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(0,0,0,.6);
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-info { padding: 12px; }
.related-section { margin-top: 24px; }
.related-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}
.related-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--divider);
  color: var(--text);
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
}
.chip:active { background: var(--divider); }
.loading {
  text-align: center;
  padding: 50px;
  color: var(--secondary);
  font-size: 14px;
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--divider);
  border-top-color: var(--primary);
  border-radius: 50%;
  margin: 0 auto 16px;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.no-results, .error-box {
  text-align: center;
  padding: 50px;
  color: var(--secondary);
  font-size: 14px;
}
.error-box button {
  margin-top: 16px;
  padding: 10px 28px;
  border: none;
  border-radius: 24px;
  background: var(--primary);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
}
.load-more {
  text-align: center;
  padding: 20px;
}
.load-more button {
  padding: 12px 32px;
  border: 1px solid var(--divider);
  border-radius: 24px;
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
}
.load-more button:active { background: var(--divider); }
</style>
</head>
<body>

<div class="home" id="homePage">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="2"/>
      <path d="M2 12h20M12 2c3 3 4.5 6 4.5 10s-1.5 7-4.5 10c-3-3-4.5-6-4.5-10s1.5-7 4.5-10z" stroke="#fff" stroke-width="1.5"/>
      <path d="M13 5l-5 8h4l-2 6 6-9h-3z" fill="#ffd600" stroke="#ffd600" stroke-width="0.5"/>
    </svg>
  </div>
  <div class="brand">Lumen<span>Search</span></div>
  <div class="tagline">Self-hosted. Private. Yours.</div>

  <form class="search-form" id="searchForm">
    <div class="search-input-wrap">
      <input class="search-input" type="search" id="homeQuery" placeholder="Search the web privately" autocomplete="off" autocapitalize="off" spellcheck="false">
      <svg class="search-btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg>
      <div class="suggestions" id="homeSuggestions"></div>
    </div>
  </form>

  <div class="protection-badge" id="protectionBadge">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
    <span id="protectionText">Protected</span>
  </div>

  <div class="footer">Lumen Search &middot; Self-hosted &middot; Powered by DuckDuckGo</div>
</div>

<div class="results-page" id="resultsPage">
  <div class="results-header">
    <div class="search-row">
      <button class="results-home" id="resultsHome">&#8962;</button>
      <div class="results-bar">
        <input class="results-input" type="search" id="resultsQuery" placeholder="Search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <svg class="results-search-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-type="WEB">All</button>
      <button class="tab" data-type="IMAGES">Images</button>
      <button class="tab" data-type="VIDEOS">Videos</button>
      <button class="tab" data-type="NEWS">News</button>
      <div class="protection-mini" id="protectionMini">
        <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        <span id="protectionMiniText">Protected</span>
      </div>
    </div>
  </div>
  <div class="results-body" id="resultsBody">
    <div class="results-meta" id="resultsMeta"></div>
    <div id="resultsContainer"></div>
    <div id="relatedSection" class="related-section" style="display:none">
      <div class="related-title">Related Searches</div>
      <div class="related-chips" id="relatedChips"></div>
    </div>
    <div class="load-more" id="loadMore" style="display:none">
      <button id="loadMoreBtn">Load more</button>
    </div>
  </div>
</div>

<script>
(function(){
  var API = '';
  var home = document.getElementById('homePage');
  var resultsPage = document.getElementById('resultsPage');
  var homeQuery = document.getElementById('homeQuery');
  var resultsQuery = document.getElementById('resultsQuery');
  var resultsContainer = document.getElementById('resultsContainer');
  var resultsMeta = document.getElementById('resultsMeta');
  var relatedSection = document.getElementById('relatedSection');
  var relatedChips = document.getElementById('relatedChips');
  var loadMore = document.getElementById('loadMore');
  var currentQuery = '';
  var currentType = 'WEB';
  var resultCount = 0;

  function doSearch(q, type) {
    q = (q || '').trim();
    if (!q) return;
    type = type || currentType;
    currentQuery = q;
    currentType = type;
    resultCount = 0;
    home.classList.add('hidden');
    resultsPage.classList.add('visible');
    resultsQuery.value = q;
    hideSuggestions();
    updateTabs(type);
    resultsMeta.textContent = '';
    resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Searching</div>';
    relatedSection.style.display = 'none';
    loadMore.style.display = 'none';
    fetch(API + '/search?q=' + encodeURIComponent(q) + '&type=' + type)
      .then(function(r){ return r.json(); })
      .then(function(data){ renderResults(data); })
      .catch(function(){
        resultsContainer.innerHTML = '<div class="error-box">Could not reach search engine.<br><button onclick="window.doSearch(window.currentQuery, window.currentType)">Retry</button></div>';
      });
  }

  function renderResults(data) {
    if (data.error) {
      resultsContainer.innerHTML = '<div class="error-box">' + escapeHtml(data.error) + '<br><button onclick="window.doSearch(window.currentQuery, window.currentType)">Retry</button></div>';
      return;
    }
    var results = data.results || [];
    resultCount = results.length;
    resultsMeta.textContent = resultCount + ' results for "' + currentQuery + '"';

    if (currentType === 'IMAGES') {
      renderImages(results);
    } else if (currentType === 'VIDEOS') {
      renderVideos(results);
    } else {
      renderWeb(results);
    }

    if (data.related && data.related.length > 0) {
      relatedSection.style.display = 'block';
      var html = '';
      for (var i = 0; i < data.related.length; i++) {
        var safeRel = escapeHtml(data.related[i]);
        html += '<span class="chip" onclick="window.doSearch(\'' + safeRel.replace(/'/g, "\\'") + '\')">' + safeRel + '</span>';
      }
      relatedChips.innerHTML = html;
    } else {
      relatedSection.style.display = 'none';
    }

    if (resultCount === 0) {
      resultsContainer.innerHTML = '<div class="no-results">No results found.</div>';
    }
  }

  function renderWeb(results) {
    var html = '';
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      var safeTitle = escapeHtml(r.title);
      var safeSnippet = escapeHtml(r.snippet);
      var safeUrl = escapeHtml(r.url);
      var safeDisplay = escapeHtml(r.display);
      var safeSource = escapeHtml(r.source || '');
      var safeFavicon = escapeHtml(r.favicon || '');
      var sourceLabel = safeSource === 'wiki' ? 'Wikipedia' : safeSource.toUpperCase();
      var letter = (r.display || r.title || '?')[0].toUpperCase();
      html += '<a class="result-card" href="' + safeUrl + '">' +
        '<div class="result-favicon">' +
          (safeFavicon ? '<img src="' + safeFavicon + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span class="fallback" style="display:none">' + letter + '</span>' : '<span class="fallback">' + letter + '</span>') +
        '</div>' +
        '<div class="result-content">' +
          '<div class="result-url"><span>&#127760;</span> ' + safeDisplay +
            '<span class="result-source">' + sourceLabel + '</span></div>' +
          '<div class="result-title">' + safeTitle + '</div>' +
          '<div class="result-snippet">' + safeSnippet + '</div>' +
        '</div>' +
      '</a>';
    }
    resultsContainer.innerHTML = html;
  }

  function renderImages(results) {
    var html = '<div class="image-grid">';
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      var safeUrl = escapeHtml(r.url);
      var safeThumb = escapeHtml(r.thumbnail || r.url);
      var safeTitle = escapeHtml(r.title);
      html += '<a class="image-item" href="' + safeUrl + '" title="' + safeTitle + '">' +
        '<img src="' + safeThumb + '" loading="lazy" onerror="this.style.background=\'var(--divider)\'">' +
      '</a>';
    }
    html += '</div>';
    resultsContainer.innerHTML = html;
  }

  function renderVideos(results) {
    var html = '';
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      var safeUrl = escapeHtml(r.url);
      var safeThumb = escapeHtml(r.thumbnail || '');
      var safeTitle = escapeHtml(r.title);
      html += '<a class="video-card" href="' + safeUrl + '">' +
        '<div class="video-thumb">' +
          (safeThumb ? '<img src="' + safeThumb + '" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
          '<div class="video-play"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div>' +
        '</div>' +
        '<div class="video-info"><div class="result-title">' + safeTitle + '</div></div>' +
      '</a>';
    }
    resultsContainer.innerHTML = html || '<div class="no-results">No videos found.</div>';
  }

  function updateTabs(type) {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-type') === type);
    }
  }

  window.__lumenResults = function(json) {
    try {
      var data = JSON.parse(json);
      renderResults(data);
    } catch(e) {
      resultsContainer.innerHTML = '<div class="error-box">Could not load results.<br><button onclick="window.doSearch(window.currentQuery, window.currentType)">Retry</button></div>';
    }
  };

  function showSuggestions(items) {
    var container = document.getElementById('homeSuggestions');
    if (!container || !items.length) { hideSuggestions(); return; }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var s = escapeHtml(items[i]);
      html += '<div class="suggestion" onclick="window.doSearch(\'' + s.replace(/'/g, "\\'") + '\')">' +
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg>' +
        s + '</div>';
    }
    container.innerHTML = html;
    container.classList.add('visible');
  }

  function hideSuggestions() {
    var s1 = document.getElementById('homeSuggestions');
    if (s1) s1.classList.remove('visible');
  }

  var currentActiveInput = 'home';
  var suggestionTimer = null;

  function setupSuggestions(input, id) {
    input.addEventListener('input', function() {
      var q = input.value.trim();
      if (q.length < 2) { hideSuggestions(); return; }
      clearTimeout(suggestionTimer);
      suggestionTimer = setTimeout(function() {
        fetch(API + '/suggest?q=' + encodeURIComponent(q))
          .then(function(r){ return r.json(); })
          .then(function(data){ showSuggestions(data.suggestions || []); })
          .catch(function(){});
      }, 250);
    });
    input.addEventListener('focus', function() { currentActiveInput = id; });
    input.addEventListener('blur', function() {
      setTimeout(hideSuggestions, 200);
    });
  }

  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('searchForm').addEventListener('submit', function(e) {
    e.preventDefault();
    doSearch(homeQuery.value);
  });

  resultsQuery.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      doSearch(resultsQuery.value);
    }
  });

  document.getElementById('resultsHome').addEventListener('click', function() {
    home.classList.remove('hidden');
    resultsPage.classList.remove('visible');
    homeQuery.value = '';
    homeQuery.focus();
    resultsContainer.innerHTML = '';
  });

  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function() {
      var type = this.getAttribute('data-type');
      if (type !== currentType) {
        doSearch(currentQuery, type);
      }
    });
  }

  setupSuggestions(homeQuery, 'home');

  window.doSearch = doSearch;
  window.currentQuery = '';
  window.currentType = 'WEB';

  document.getElementById('protectionText').textContent = 'Protected';
  document.getElementById('protectionMiniText').textContent = 'Protected';

  homeQuery.focus();

  var hash = location.hash || '';
  var match = hash.match(/[#&]q=([^&]+)/);
  if (match) {
    var q = decodeURIComponent(match[1]);
    doSearch(q);
  }
})();
</script>
</body>
